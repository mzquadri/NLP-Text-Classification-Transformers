<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="940" height="380" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">AG News classification: classical baselines vs a fine-tuned transformer</text>

  <!-- Data -->
  <rect x="30" y="70" width="200" height="86" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">AG News dataset</text>
  <text x="130" y="114" text-anchor="middle" font-size="12" fill="#9a3412">via Hugging Face Datasets</text>
  <text x="130" y="132" text-anchor="middle" font-size="12" fill="#9a3412">4 classes: World, Sports,</text>
  <text x="130" y="147" text-anchor="middle" font-size="12" fill="#9a3412">Business, Sci/Tech</text>

  <!-- Split -->
  <rect x="30" y="196" width="200" height="66" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="221" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Split policy</text>
  <text x="130" y="239" text-anchor="middle" font-size="11.5" fill="#475569">stratified validation for tuning</text>
  <text x="130" y="254" text-anchor="middle" font-size="11.5" fill="#475569">published test split held out</text>

  <!-- Track A -->
  <rect x="310" y="60" width="290" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="455" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Track A — TF-IDF + scikit-learn</text>
  <text x="455" y="104" text-anchor="middle" font-size="12" fill="#1e40af">Logistic Regression · Linear SVM · Random Forest</text>
  <text x="455" y="122" text-anchor="middle" font-size="12" fill="#1e40af">5-fold cross-validation on the training set</text>
  <text x="455" y="140" text-anchor="middle" font-size="12" fill="#1e40af">fast to train, strong bag-of-words reference</text>
  <text x="455" y="158" text-anchor="middle" font-size="11.5" fill="#64748b">src/train.py --model baseline</text>

  <!-- Track B -->
  <rect x="310" y="190" width="290" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="455" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#6d28d9">Track B — DistilBERT fine-tuning</text>
  <text x="455" y="234" text-anchor="middle" font-size="12" fill="#5b21b6">distilbert-base-uncased, 4 output labels</text>
  <text x="455" y="252" text-anchor="middle" font-size="12" fill="#5b21b6">Hugging Face Trainer · classifier dropout 0.1</text>
  <text x="455" y="270" text-anchor="middle" font-size="12" fill="#5b21b6">optional backbone freezing / gradual unfreezing</text>
  <text x="455" y="288" text-anchor="middle" font-size="11.5" fill="#64748b">src/train.py --model distilbert</text>

  <!-- Evaluation -->
  <rect x="680" y="120" width="230" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="795" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">Evaluation</text>
  <text x="795" y="166" text-anchor="middle" font-size="12" fill="#166534">accuracy and macro-F1</text>
  <text x="795" y="184" text-anchor="middle" font-size="12" fill="#166534">confusion matrices per class</text>
  <text x="795" y="202" text-anchor="middle" font-size="12" fill="#166534">optional inference latency</text>
  <text x="795" y="224" text-anchor="middle" font-size="11.5" fill="#64748b">src/evaluate.py · src/inference.py</text>

  <!-- Arrows -->
  <line x1="230" y1="113" x2="300" y2="113" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="230" y1="229" x2="300" y2="243" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="600" y1="115" x2="670" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="600" y1="245" x2="670" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Chips -->
  <rect x="110" y="322" width="340" height="34" rx="17" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#475569">--synthetic offline fixture: dev only, not comparable</text>
  <rect x="470" y="322" width="360" height="34" rx="17" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="650" y="344" text-anchor="middle" font-size="12" fill="#475569">data, checkpoints and metrics are not versioned</text>
</svg>
