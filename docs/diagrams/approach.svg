<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"
     font-family="Segoe UI, DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Source -->
  <rect x="330" y="24" width="300" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="480" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">AG News</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#4B5563">120,000 train and 7,600 published test, four classes</text>

  <!-- Split -->
  <path d="M480 84 L480 108" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <rect x="270" y="108" width="420" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.4"/>
  <text x="480" y="128" text-anchor="middle" font-size="12.5" fill="#111827">stratified split, seed 42</text>
  <text x="480" y="147" text-anchor="middle" font-size="11.5" fill="#4B5563">108,000 train &#183; 12,000 validation &#183; 7,600 test, untouched until scoring</text>

  <path d="M480 160 L480 182" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <path d="M480 182 L250 182 L250 206" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <path d="M480 182 L710 182 L710 206" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>

  <!-- Left branch: TF-IDF -->
  <rect x="80" y="206" width="340" height="58" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="250" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">TfidfVectorizer</text>
  <text x="250" y="248" text-anchor="middle" font-size="11.5" fill="#4B5563">1-2 grams, min_df 3, sublinear tf, fitted on train only</text>

  <path d="M250 264 L250 288" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <rect x="80" y="288" width="340" height="58" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="250" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">LinearSVC</text>
  <text x="250" y="330" text-anchor="middle" font-size="11.5" fill="#4B5563">chosen on validation over logistic regression and random forest</text>

  <path d="M250 346 L250 370" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <rect x="80" y="370" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="250" y="390" text-anchor="middle" font-size="12" fill="#111827">models/tfidf-linear-svm/</text>
  <text x="250" y="408" text-anchor="middle" font-size="11" fill="#4B5563">model.joblib &#183; vectorizer.joblib &#183; metadata.json</text>

  <!-- Right branch: DistilBERT -->
  <rect x="540" y="206" width="340" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="710" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">DistilBERT tokenizer</text>
  <text x="710" y="248" text-anchor="middle" font-size="11.5" fill="#4B5563">distilbert-base-uncased, max length 128, dynamic padding</text>

  <path d="M710 264 L710 288" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <rect x="540" y="288" width="340" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="710" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">fine-tuned DistilBERT</text>
  <text x="710" y="330" text-anchor="middle" font-size="11.5" fill="#4B5563">2 epochs, AdamW, linear decay, epoch chosen on validation</text>

  <path d="M710 346 L710 370" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <rect x="540" y="370" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="710" y="390" text-anchor="middle" font-size="12" fill="#111827">models/distilbert-ag-news/</text>
  <text x="710" y="408" text-anchor="middle" font-size="11" fill="#4B5563">model.safetensors &#183; tokenizer.json &#183; config.json &#183; metadata.json</text>

  <!-- Join -->
  <path d="M250 422 L250 446 L480 446" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <path d="M710 422 L710 446 L480 446" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>
  <path d="M480 446 L480 466" stroke="#9CA3AF" stroke-width="1.6" fill="none"/>

  <rect x="230" y="466" width="500" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="480" y="488" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">the same 7,600 held-out documents, scored once per model</text>
  <text x="480" y="508" text-anchor="middle" font-size="11.5" fill="#4B5563">accuracy &#183; macro F1 &#183; per-class precision and recall &#183; confusion pairs &#183; fit and inference cost</text>

  <text x="480" y="544" text-anchor="middle" font-size="11" fill="#9CA3AF">Each model is loaded with the preprocessing saved beside it. Nothing is rebuilt from defaults at evaluation.</text>
</svg>
