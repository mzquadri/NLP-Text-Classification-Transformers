name: Repository check

on:
  push:
  pull_request:

# Continuous integration does not fine-tune DistilBERT. That run needs a GPU and
# takes roughly forty minutes, so it is done once by hand and its results are
# committed. What CI does instead is check that the recorded transformer numbers
# are internally consistent, still support the claims the README makes from them,
# and name a complete artifact directory. The classical track is fast and is
# rerun in full.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.1

      - name: Lint
        run: ruff check .

      - name: Files present, src compiles, README matches the recorded results
        run: python scripts/check_repository.py

      - name: Tests
        run: python -m unittest discover -s tests

      - name: The recorded results still support the same conclusions
        run: python scripts/check_reproducibility.py

      - name: The figures still render
        run: python scripts/figures/generate_figures.py

      - name: Smoke test
        run: python scripts/smoke_test.py
